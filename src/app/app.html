<header class="bg-white shadow-md sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16">
      <!-- Logo / App Name -->
      <div class="flex-shrink-0">
        <span class="text-2xl font-bold text-primary-blue flex items-center">
          <i data-lucide="scan" class="w-6 h-6 mr-2"></i>
          Inventory App
        </span>
      </div>

      <!-- Desktop Navigation Links -->
      <nav class="hidden md:flex space-x-6">
        <a href="#"
          class="text-primary-dark hover:text-primary-blue px-3 py-2 text-sm font-medium transition duration-150 ease-in-out rounded-lg">
          <i data-lucide="layout-dashboard" class="inline w-4 h-4 mr-1"></i> Dashboard
        </a>
        <a href="#"
          class="text-primary-dark hover:text-primary-blue px-3 py-2 text-sm font-medium transition duration-150 ease-in-out rounded-lg">
          <i data-lucide="laptop" class="inline w-4 h-4 mr-1"></i> Devices
        </a>
        <a href="#"
          class="text-primary-blue bg-secondary-gray/50 px-3 py-2 text-sm font-medium transition duration-150 ease-in-out rounded-lg">
          <i data-lucide="key-round" class="inline w-4 h-4 mr-1"></i> Licenses
        </a>
        <a href="#"
          class="text-primary-dark hover:text-primary-blue px-3 py-2 text-sm font-medium transition duration-150 ease-in-out rounded-lg">
          <i data-lucide="bar-chart-3" class="inline w-4 h-4 mr-1"></i> Reports
        </a>
      </nav>

      <!-- Authentication Buttons -->
      <div class="flex items-center space-x-3">
        <!-- Register Button (Hidden on small mobile, visible on sm and up) -->
        <a href="#"
          class="px-4 py-2 text-sm font-medium text-primary-dark border border-gray-300 rounded-lg hover:bg-secondary-gray transition duration-150 ease-in-out hidden sm:inline-flex">
          Register
        </a>
        <!-- Login Button (Always visible) -->
        <a href="#"
          class="px-4 py-2 text-sm font-medium text-white bg-primary-blue rounded-lg hover:bg-indigo-700 transition duration-150 ease-in-out">
          Login
        </a>

        <!-- Mobile menu button (Hamburger - kept for responsiveness) -->
        <button id="mobile-menu-button"
          class="md:hidden p-2 text-gray-500 hover:text-primary-blue rounded-lg transition duration-150 ease-in-out focus:outline-none focus:ring-2 focus:ring-primary-blue">
          <i data-lucide="menu" class="w-6 h-6"></i>
        </button>
      </div>

      <!--                 
                <div class="flex items-center space-x-3">
                    <button class="p-2 text-gray-500 hover:text-primary-blue rounded-full transition duration-150 ease-in-out focus:outline-none focus:ring-2 focus:ring-primary-blue">
                         <i data-lucide="settings" class="w-5 h-5"></i>
                    </button>
                    <div class="hidden md:block">
                        <img class="h-8 w-8 rounded-full object-cover" src="https://placehold.co/128x128/60a5fa/ffffff?text=U" alt="User Profile">
                    </div>
                    <button id="mobile-menu-button" class="md:hidden p-2 text-gray-500 hover:text-primary-blue rounded-lg transition duration-150 ease-in-out focus:outline-none focus:ring-2 focus:ring-primary-blue">
                         <i data-lucide="menu" class="w-6 h-6"></i>
                    </button>
                </div>
          -->
    </div>


    <!-- Mobile Menu (Hidden by default, requires JS to toggle. For this static example, we'll keep it simple responsive) -->
    <!-- If you needed a full toggle, you would use JavaScript to change the 'hidden' class on click. -->
  </div>
</header>

<router-outlet />

<!-- FOOTER -->
<footer class="bg-primary-dark text-white mt-12 py-8">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex flex-col md:flex-row justify-between items-center text-center md:text-left space-y-4 md:space-y-0">

      <!-- Left Section: Copyright & Company -->
      <p class="text-sm text-gray-400">
        &copy; <span id="current-year"></span> Company Name Inc. All rights reserved.
      </p>

      <!-- Center Section: Quick Links -->
      <div class="flex space-x-6 text-sm">
        <a href="#" class="text-gray-400 hover:text-white transition duration-150">Privacy Policy</a>
        <a href="#" class="text-gray-400 hover:text-white transition duration-150">Terms of Service</a>
        <a href="#" class="text-gray-400 hover:text-white transition duration-150">Support</a>
      </div>

      <!-- Right Section: Version/Metadata -->
      <p class="text-xs text-gray-500">
        Inventory
      </p>
    </div>
  </div>
</footer>

<!-- JavaScript to initialize Lucide icons and set current year -->
<script>
  // Initializes Lucide icons (must be called after elements are in DOM)
  lucide.createIcons();

  // Set the current year for the copyright notice
  document.getElementById('current-year').textContent = new Date().getFullYear();
